name: Mobile Tests

on:
  push:
    paths:
      - 'mobile-testing/**'
  pull_request:
    paths:
      - 'mobile-testing/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Enable KVM (hardware acceleration for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Wikipedia APK
        run: |
          curl -L "https://github.com/wikimedia/apps-android-wikipedia/releases/download/latest-2.7-r-2024-06-20/app-alpha-universal-release.apk" \
               -o wikipedia.apk

      - name: Start Appium server
        run: |
          npm install -g appium@2.11.2
          appium driver install uiautomator2
          appium &
          sleep 5

      - name: Run Android emulator + tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: Nexus 6
          avd-name: test_avd
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd mobile-testing
            WIKIPEDIA_APK=$GITHUB_WORKSPACE/mobile-testing/wikipedia.apk mvn test --no-transfer-progress

      - name: Upload Surefire report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-surefire-report
          path: mobile-testing/target/surefire-reports/
          retention-days: 30
