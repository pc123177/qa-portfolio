name: Mobile Tests

on:
  push:
    paths:
      - 'mobile-testing/**'
  pull_request:
    paths:
      - 'mobile-testing/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and validate (no emulator in CI)
        run: mvn compile test-compile --no-transfer-progress

      - name: Run unit-level checks
        run: mvn verify -DskipTests --no-transfer-progress
